<html lang="en">
<head>
<meta charset="utf-8">

<title>World energy day 2026</title>
<style>
:root{--hydro-blue:#444D55;--hydro-light-blue:#768692;--hydro-aluminium:#8C8C8C;--hydro-green:#43807A;--hydro-warm:#C5B9AC;--hydro-bauxite:#B95946;--hydro-mid-gray:#757575;--hydro-light-gray:#F4F4F4;--black:#000000;--white:#FFFFFF;--blue:var(--hydro-green);--navy:var(--hydro-blue);--green:var(--hydro-green);--red:var(--hydro-bauxite);--ink:var(--black);--soft:var(--hydro-light-gray)}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--hydro-light-gray)}
main{max-width:980px;margin:auto;padding:clamp(12px,3vw,28px)}
.card{background:rgba(255,255,255,.97);border-radius:18px;box-shadow:0 10px 30px rgba(68,77,85,.16);overflow:hidden;border:1px solid #d7dadd}
header{padding:22px 24px 14px;background:var(--white);color:var(--hydro-blue);border-top:10px solid var(--hydro-blue);border-bottom:1px solid #d7dadd}
h1{font-size:clamp(1.45rem,4vw,2.25rem);margin:0 0 6px}.lead{margin:0;color:var(--hydro-mid-gray);line-height:1.45}.brandbar{display:flex;align-items:center;justify-content:space-between;gap:18px}.hydro-logo{width:104px;min-width:104px;height:auto;display:block;object-fit:contain}.eyebrow{font:700 .78rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--hydro-green);margin:0 0 5px}
.panel{padding:18px 24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-family:Arial,sans-serif;font-weight:700;color:var(--hydro-blue);display:block;margin-bottom:5px}.field input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--hydro-aluminium);border-radius:9px;background:#fff}.field input:focus{outline:3px solid rgba(67,128,122,.22);border-color:var(--hydro-green)}
.instructions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 10px}.instructions p{margin:0;line-height:1.4}.counter{white-space:nowrap;font-weight:750;color:var(--hydro-blue);background:var(--hydro-light-gray);border:1px solid #d7dadd;padding:8px 12px;border-radius:999px}
.stage{position:relative;width:100%;line-height:0;overflow:hidden;border-radius:13px;touch-action:manipulation;background:#111;user-select:none;-webkit-user-select:none}.stage img{width:100%;height:auto;display:block;pointer-events:none}.mark{position:absolute;width:clamp(31px,6.5vw,55px);aspect-ratio:1;border:4px solid var(--red);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(255,255,255,.8),0 2px 8px rgba(0,0,0,.35);animation:pop .18s ease-out;pointer-events:none}.mark.found{border-color:var(--hydro-green);background:rgba(67,128,122,.16)}.mark.miss{border-color:var(--hydro-bauxite);background:rgba(185,89,70,.14)}@keyframes pop{from{scale:.45;opacity:.2}to{scale:1;opacity:1}}
.feedback{min-height:28px;margin:10px 0 0;font-weight:650}.feedback.good{color:var(--green)}.feedback.bad{color:var(--hydro-bauxite)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;cursor:pointer}.primary{background:var(--hydro-green);color:#fff}.primary:hover{background:#356b66}.primary:disabled{background:#97a7b2;cursor:not-allowed}.secondary{background:var(--hydro-light-blue);color:#fff}.ghost{background:#fff;border:1px solid var(--hydro-aluminium);color:var(--hydro-blue)}
.consent{display:flex;gap:9px;align-items:flex-start;margin-top:15px;font-size:.92rem;line-height:1.35}.consent input{margin-top:3px}.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.92rem;line-height:1.4}.status.ok{background:#edf5f4;color:#285f5a}.status.error{background:#f8ece9;color:#7a3529}
footer{padding:0 24px 22px;color:var(--hydro-mid-gray);font-size:.82rem;line-height:1.4}.hidden{display:none!important}
@media(max-width:650px){.hydro-logo{width:82px;min-width:82px}.formgrid{grid-template-columns:1fr}.panel{padding:15px}.instructions{align-items:flex-start;flex-direction:column}header{padding:18px 16px 12px}footer{padding:0 16px 18px}}
.lang-button{
    background:#43807A;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    display:inline-block;
}

.lang-button:hover{
    opacity:0.9;
}
</style>

<label class="consent"><input id="consent" type="checkbox"><span>I accept that my contact information can be used to contact me if I win</span></label>

<script>
/*
 Kobling til forms
*/
const CONFIG={
  title:"Finn energiavvikene",
  formsUrl:"https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=kYkdvChKUkWrwaznrhCCdJPLCg4y8ptChRVfBhdKBKZUNzFEQ1hRVlFUTFNTN1MzNkNBNFlOUFpFOC4u&rf93a042985f646d7874c0de38d67aad6=%7BNAME%7D&r3651796970464b17ac21885d0e8d4e2e=%7BCONTACT%7D&r9bb72db7746f40f39e1a4761ba2b36f8=%7BSCORE%7D&r8994cc1f6c11474ea9ed50bfe2713e64=%7BLOCATION%7D&rc0a6f1cc466e479f87114be797957d6a=%7BFOUND_IDS%7D",
  targetCount:6,
  allowSubmitBeforeComplete:true
};
// Coordinates are percentages of the LEFT picture only. Adjust x/y/r
const TARGETS=[
 {id:"pipe_leak",x:30.7,y:20.7,r:5.4},
 {id:"open_door",x:49.6,y:33.4,r:10.6},
 {id:"red_stack_light",x:13.6,y:39.0,r:4.5},
 {id:"open_hot_machine",x:85.0,y:47.4,r:8.8},
 {id:"forklift_smoke",x:67.0,y:61.8,r:6.2},
 {id:"equipment_alarm",x:18.5,y:72.2,r:10.0}
];
const stage=document.getElementById('stage'), feedback=document.getElementById('feedback'), statusBox=document.getElementById('status');
const found=new Set(); const taps=[];
document.getElementById('title').textContent=CONFIG.title;
document.getElementById('targetTotal').textContent=CONFIG.targetCount;
document.getElementById('targetTotal2').textContent=CONFIG.targetCount;
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
const entryId=uid();
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function render(){stage.querySelectorAll('.mark').forEach(n=>n.remove());taps.forEach(t=>{const m=document.createElement('span');m.className='mark '+(t.hit?'found':'miss');m.style.left=t.x+'%';m.style.top=t.y+'%';stage.appendChild(m)});document.getElementById('foundCount').textContent=found.size;document.getElementById('submit').disabled=!CONFIG.allowSubmitBeforeComplete&&found.size<CONFIG.targetCount}
function tapAt(x,y){let hit=null;for(const t of TARGETS){if(!found.has(t.id)&&distance({x,y},t)<=t.r){hit=t;break}}taps.push({x:+x.toFixed(2),y:+y.toFixed(2),hit:hit?hit.id:null});if(hit){found.add(hit.id);feedback.textContent=found.size===CONFIG.targetCount?'Excellent — all deviations found!':'Correct! — '+found.size+' of '+CONFIG.targetCount+' found.';feedback.className='feedback good'}else{feedback.textContent='Not one of the deviations. Try again.';feedback.className='feedback bad'}render()}
stage.addEventListener('pointerup',e=>{const r=stage.getBoundingClientRect();tapAt((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});
document.getElementById('undo').onclick=()=>{const t=taps.pop();if(!t)return;if(t.hit){found.delete(t.hit);for(const prev of taps)if(prev.hit===t.hit)found.add(t.hit)}feedback.textContent='Last mark removed.';feedback.className='feedback';render()};
document.getElementById('reset').onclick=()=>{taps.length=0;found.clear();feedback.textContent='Alle markings removed.';feedback.className='feedback';statusBox.className='status hidden';render()};
function payload(){return{id:entryId,name:document.getElementById('name').value.trim(),contact:document.getElementById('contact').value.trim(),location:document.getElementById('location').value.trim(),score:found.size,completed:found.size===CONFIG.targetCount,taps,foundIds:[...found],submittedAt:new Date().toISOString(),userAgent:navigator.userAgent}}
function valid(){if(!document.getElementById('name').value.trim()||!document.getElementById('contact').value.trim()||!document.getElementById('location').value.trim()){show('Please fill in your contact informations','error');return false}if(!document.getElementById('consent').checked){show('Please accept terms','error');return false}return true}
function show(msg,type=''){statusBox.textContent=msg;statusBox.className='status '+type}
function buildFormsUrl(data){
 const replacements={
  "{NAME}":data.name,"{CONTACT}":data.contact,"{LOCATION}":data.location,"{SCORE}":String(data.score),
  "{ENTRY_ID}":data.id,"{FOUND_IDS}":data.foundIds.join(", ")
 };
 let url=CONFIG.formsUrl;
 for(const [token,value] of Object.entries(replacements)){
  url=url.split(token).join(encodeURIComponent(value));
  url=url.split(encodeURIComponent(token)).join(encodeURIComponent(value));
 }
 return url;
}
document.getElementById('submit').onclick=()=>{
 if(!valid())return;
 const data=payload();
 if(!CONFIG.formsUrl||CONFIG.formsUrl.includes('PASTE_YOUR_')){
  show('Microsoft Forms is not configured yet. The organiser must paste the generated pre-filled Forms link into CONFIG.formsUrl.','error');
  return;
 }
 try{
  const target=buildFormsUrl(data);
  localStorage.setItem('hydroSafetyEntry',JSON.stringify(data));
  window.location.href=target;
 }catch(err){show('Microsoft Forms could not be opened. Check the configured Forms link.','error')}
};
render();
</script>
